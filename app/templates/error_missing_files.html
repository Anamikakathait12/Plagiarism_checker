<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Missing file</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 640px;">
    <div class="alert alert-danger">
      <h4 class="alert-heading">File not found</h4>
      <p>The submission <strong>{{ filename }}</strong> is listed in the database but is missing from the uploads folder.</p>
      <hr>
      <p class="mb-0 small text-muted">Expected at: {{ expected_path }}</p>
    </div>
    <a href="javascript:history.back()" class="btn btn-secondary">Go back</a>
  </div>
</body>
</html>
